[project]
name = "gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "mcp[cli]>=1.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "pyobjc-framework-Contacts>=10",
    "httpx>=0.25",
    "anyio>=4",
    "uvicorn>=0.20",
    "starlette>=0.27",
    "google-api-python-client>=2",
    "google-auth>=2",
    "google-auth-oauthlib>=1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
gateway = "gateway.main:main"
gw = "gateway.cli:main"
